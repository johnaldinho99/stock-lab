<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aktielabbet</title>
  <meta name="description" content="Backtesta klassiska investeringsstrategier, Magic Formula och maskininlärning mot S&P 500, globalindex och OMXS30." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232a78d6'/><polyline points='18,70 38,52 54,60 82,28' fill='none' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Strategier">
      <div class="brand">
        <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--accent)"/><polyline points="18,70 38,52 54,60 82,28" fill="none" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div>
          <div class="brand-title">Aktielabbet</div>
          <div class="brand-sub">Backtesta investeringsstrategier</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span id="nav-note"></span>
        <span>Inte investeringsrådgivning. Historisk avkastning är ingen garanti.</span>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <main class="main" id="main">
      <header class="topbar">
        <div class="title-row">
          <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Visa strategier">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
          </button>
          <div id="title" class="title-block"></div>
        </div>
        <div class="topbar-meta">
          <span id="data-chip" class="chip"><span class="dot"></span><span>Laddar…</span></span>
          <span id="alpaca-chip" class="chip" title="Alpaca live-data"><span class="dot"></span><span>Alpaca</span></span>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Byt mellan ljust och mörkt tema" title="Byt tema">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18V3z"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </header>

      <section id="filters" class="filters" aria-label="Inställningar"></section>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Vy"></nav>
      <div id="status" class="status" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
