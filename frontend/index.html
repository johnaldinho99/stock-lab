<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aktielabbet</title>
  <meta name="description" content="Backtesta klassiska investeringsstrategier, Magic Formula och maskininlärning mot S&P 500, globalindex och OMXS30." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070b11'/><polyline points='18,70 38,52 54,60 82,28' fill='none' stroke='%234aa8ff' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Strategier">
      <div class="brand">
        <svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient></defs>
          <rect x="2" y="2" width="96" height="96" rx="20" fill="#070b11" stroke="url(#lg)" stroke-width="3"/>
          <g stroke="#1f2a38" stroke-width="2"><line x1="16" y1="34" x2="84" y2="34"/><line x1="16" y1="52" x2="84" y2="52"/><line x1="16" y1="70" x2="84" y2="70"/></g>
          <polyline points="16,72 34,54 50,62 66,40 84,26" fill="none" stroke="url(#lg)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="84" cy="26" r="6" fill="#4aa8ff"/>
        </svg>
        <div>
          <div class="brand-title">Aktielabbet</div>
          <div class="brand-sub">Quant · Backtest · Live</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <span id="nav-note"></span>
        <span>Inte investeringsrådgivning. Historisk avkastning är ingen garanti.</span>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <main class="main" id="main">
      <div id="tape" class="tape" aria-label="Marknadskurser" hidden><div class="tape-track" id="tape-track"></div></div>
      <header class="topbar">
        <div class="title-row">
          <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Visa strategier">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
          </button>
          <div id="title" class="title-block"></div>
        </div>
        <div class="topbar-meta">
          <span id="clock" class="chip clock" title="Tid i New York"><span class="dot"></span><span>NYSE</span></span>
          <span id="data-chip" class="chip"><span class="dot"></span><span>Laddar…</span></span>
          <span id="alpaca-chip" class="chip" title="Alpaca live-data"><span class="dot"></span><span>Alpaca</span></span>
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Byt mellan ljust och mörkt tema" title="Byt tema">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18V3z"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          </button>
        </div>
      </header>

      <section id="filters" class="filters" aria-label="Inställningar"></section>
      <nav id="tabs" class="tabs" role="tablist" aria-label="Vy"></nav>
      <div id="status" class="status" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
